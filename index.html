<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Page Forge | Professional Image to PDF Converter | Aethercore Interactive</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #000000;
            --surface: #0a0a0a;
            --accent: #ffffff;
            --border: rgba(255, 255, 255, 0.08);
            --text-muted: #666666;
            --success: #f0f0f0;
            --danger: #ff3b30;
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        
        html, body { 
            background: var(--bg); 
            color: #fff; 
            margin: 0; 
            padding: 0; 
            min-height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            font-family: 'Inter', sans-serif;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        #filename-input {
            -webkit-user-select: text !important;
            user-select: text !important;
            -webkit-touch-callout: default !important;
            pointer-events: auto !important;
        }

        .app-wrapper { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 40px 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 30px; 
        }

        header { text-align: center; padding: 40px 0 20px 0; }
        header h1 { font-weight: 100; font-size: 2.5rem; letter-spacing: -0.06em; margin: 0; }
        .branding-sub { color: var(--text-muted); font-weight: 400; font-size: 0.6rem; margin-top: 8px; letter-spacing: 0.5em; text-transform: uppercase; }

        .control-panel { 
            background: var(--surface); 
            border: 1px solid var(--border); 
            border-radius: 20px; 
            padding: 25px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }

        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-size: 0.6rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.1em; }
        #filename-input { width: 100%; height: 54px; background: #000; border: 1px solid var(--border); border-radius: 12px; color: #fff; padding: 0 15px; font-family: 'Inter', sans-serif; outline: none; }
        #filename-input:focus { border-color: var(--accent); }

        .btn { width: 100%; height: 54px; border-radius: 12px; font-size: 0.8rem; font-weight: 500; cursor: pointer; transition: 0.3s; border: none; display: flex; align-items: center; justify-content: center; letter-spacing: 0.1em; text-transform: uppercase; }
        .btn-primary { background: var(--accent); color: #000; }
        .btn-action { background: transparent; border: 1px solid var(--border); color: #fff; }
        .btn-action:disabled { opacity: 0.1; cursor: not-allowed; }
        .btn-action.complete { background: var(--success); color: #000; border: none; }

        .gallery { 
            background: var(--surface); 
            border: 1px solid var(--border); 
            border-radius: 20px; 
            padding: 15px; 
            min-height: 300px;
            position: relative;
        }
        
        #sortable-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; min-height: 300px; }

        .item { aspect-ratio: 1; background: #000; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); position: relative; cursor: pointer; }
        .item img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        .sort-number { position: absolute; top: 6px; left: 6px; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px); color: #fff; font-size: 0.5rem; padding: 3px 6px; border-radius: 4px; z-index: 2; pointer-events: none; }

        .empty-placeholder { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: #333; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; pointer-events: none; z-index: 1; }

        /* Focus Mode Styles */
        #focus-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); backdrop-filter: blur(20px); display: none; flex-direction: column; align-items: center; z-index: 10000; overflow: hidden; }
        #focus-overlay.active { display: flex; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .header-controls { position: absolute; top: 0; left: 0; width: 100%; padding: 20px; display: flex; justify-content: space-between; align-items: center; z-index: 10001; }
        
        .focus-counter { background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); padding: 8px 16px; border-radius: 20px; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.2em; color: var(--accent); border: 1px solid rgba(255,255,255,0.1); pointer-events: none; }
        
        .close-btn { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); color: #fff; font-size: 1.2rem; display: flex; justify-content: center; align-items: center; cursor: pointer; backdrop-filter: blur(10px); }

        /* NATIVE HORIZONTAL SCROLL SNAP */
        .slider-track { display: flex; width: 100%; height: 75vh; margin-top: 80px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; scroll-behavior: auto; align-items: center; }
        .slider-track::-webkit-scrollbar { display: none; }
        
        .slide { flex: 0 0 100vw; height: 100%; display: flex; justify-content: center; align-items: center; scroll-snap-align: center; padding: 0 20px; }
        
        .slide-inner { max-width: 100%; max-height: 100%; background: #000; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 40px 100px rgba(0,0,0,0.8); overflow: hidden; display: flex; }
        .slide-inner img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }

        .footer-controls { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: center; z-index: 10001; padding: 0 20px; }
        .delete-btn-focused { width: 100%; max-width: 300px; height: 54px; background: var(--danger); color: #fff; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.15em; cursor: pointer; border: none; }

        .sortable-ghost { opacity: 0; }
        .sortable-chosen { opacity: 0.5; transform: scale(1.05); }
    </style>
</head>
<body oncontextmenu="if(event.target.id !== 'filename-input') return false;">

<div id="focus-overlay">
    <div class="header-controls">
        <div id="focus-counter" class="focus-counter">0 OF 0</div>
        <button class="close-btn" onclick="closeFocus()">✕</button>
    </div>
    
    <div id="slider-track" class="slider-track">
        </div>
    
    <div class="footer-controls">
        <button class="delete-btn-focused" onclick="executeDelete()">Delete Image</button>
    </div>
</div>

<div class="app-wrapper">
    <header>
        <h1>Page Forge</h1>
        <div class="branding-sub">Aethercore Interactive</div>
    </header>

    <section class="control-panel">
        <div class="input-group">
            <label for="filename-input">Document Filename</label>
            <input type="text" id="filename-input" placeholder="e.g. Project_Documentation_2026">
        </div>
        <label for="uploader" class="btn btn-primary">
            Upload Images
            <input type="file" id="uploader" multiple accept="image/*" style="display:none" onchange="addPhotos(this.files)">
        </label>
        
        <button class="btn btn-action" id="mainBtn" onclick="handleAction()" disabled>
            Generate PDF
        </button>
    </section>

    <main class="gallery">
        <div class="empty-placeholder" id="placeholder-text">Foundry Offline</div>
        <div id="sortable-grid"></div>
    </main>
</div>

<script>
    const grid = document.getElementById('sortable-grid');
    const mainBtn = document.getElementById('mainBtn');
    const filenameInput = document.getElementById('filename-input');
    const placeholder = document.getElementById('placeholder-text');
    
    const overlay = document.getElementById('focus-overlay');
    const track = document.getElementById('slider-track');
    const focusCounter = document.getElementById('focus-counter');

    let isComplete = false;
    let currentActiveId = null;
    let observer;

    // Intersection Observer to detect exactly which slide is in the center
    function initObserver() {
        if(observer) observer.disconnect();
        observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if(entry.isIntersecting) {
                    currentActiveId = entry.target.dataset.id;
                    updateCounter();
                }
            });
        }, { threshold: 0.6, root: track }); // Triggers when slide is 60% visible
    }

    // Generate unique ID for linking Grid Items to Focus Slides
    function generateId() {
        return 'id-' + Date.now() + '-' + Math.floor(Math.random() * 10000);
    }

    new Sortable(grid, {
        animation: 250,
        ghostClass: 'sortable-ghost',
        delay: 200, 
        delayOnTouchOnly: true,
        touchStartThreshold: 5, 
        onEnd: syncIndices
    });

    async function addPhotos(files) {
        if (grid.querySelectorAll('.item').length + files.length > 20) return;
        placeholder.style.display = 'none';

        for (let file of files) {
            const data = await toBase64(file);
            const card = document.createElement('div');
            card.className = 'item';
            card.dataset.id = generateId(); // Attach ID
            card.onclick = function() { openFocus(this); };
            card.innerHTML = `
                <div class="sort-number"></div>
                <img src="${data}">
            `;
            grid.appendChild(card);
        }
        resetState();
        syncIndices();
    }

    function toBase64(file) {
        return new Promise(res => {
            const reader = new FileReader();
            reader.onload = () => res(reader.result);
            reader.readAsDataURL(file);
        });
    }

    function updateCounter() {
        if(!currentActiveId) return;
        const slides = Array.from(track.querySelectorAll('.slide'));
        const activeSlide = track.querySelector(`.slide[data-id="${currentActiveId}"]`);
        if(!activeSlide) return;
        
        const index = slides.indexOf(activeSlide) + 1;
        focusCounter.innerText = `${index} OF ${slides.length}`;
    }

    function openFocus(clickedCard) {
        initObserver();
        track.innerHTML = ''; // Clear track before opening
        
        const items = Array.from(grid.querySelectorAll('.item'));
        
        // Build the contiguous slide track
        items.forEach((item) => {
            const slide = document.createElement('div');
            slide.className = 'slide';
            slide.dataset.id = item.dataset.id;
            
            const imgSrc = item.querySelector('img').src;
            slide.innerHTML = `<div class="slide-inner"><img src="${imgSrc}"></div>`;
            track.appendChild(slide);
            
            observer.observe(slide);
        });

        overlay.classList.add('active');
        
        // Instantly snap to the clicked image without animating the scroll
        const targetIndex = items.indexOf(clickedCard);
        requestAnimationFrame(() => {
            track.scrollLeft = targetIndex * window.innerWidth;
        });
    }

    function closeFocus() {
        overlay.classList.remove('active');
        if(observer) observer.disconnect();
        currentActiveId = null;
    }

    function executeDelete() {
        if (!currentActiveId) return;
        
        const gridItem = grid.querySelector(`.item[data-id="${currentActiveId}"]`);
        const slideItem = track.querySelector(`.slide[data-id="${currentActiveId}"]`);
        
        if (gridItem) gridItem.remove();
        if (slideItem) {
            observer.unobserve(slideItem);
            slideItem.remove();
        }
        
        const remainingSlides = track.querySelectorAll('.slide');
        if (remainingSlides.length === 0) {
            closeFocus();
            placeholder.style.display = 'block';
        } else {
            // The next slide automatically falls into place natively, 
            // the observer will detect it and update the counter.
            setTimeout(updateCounter, 100);
        }
        
        resetState();
        syncIndices();
    }

    function syncIndices() {
        const items = grid.querySelectorAll('.item');
        items.forEach((item, i) => {
            item.querySelector('.sort-number').innerText = String(i + 1).padStart(2, '0');
        });
        if (!isComplete) {
            mainBtn.disabled = items.length === 0;
            if (items.length > 0) mainBtn.innerText = `Generate PDF (${items.length})`;
        }
    }

    function resetState() {
        isComplete = false;
        mainBtn.classList.remove('complete');
        syncIndices();
    }

    function handleAction() {
        if (isComplete) resetState();
        forgeDocument();
    }

    function forgeDocument() {
        const images = grid.querySelectorAll('.item img');
        const fileName = filenameInput.value.trim() || "Exported_Document";
        mainBtn.innerText = "Forging...";
        mainBtn.disabled = true;
        
        setTimeout(() => {
            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('p', 'pt', 'a4');
                const pageWidth = doc.internal.pageSize.getWidth();
                const pageHeight = doc.internal.pageSize.getHeight();

                images.forEach((img, i) => {
                    if (i > 0) doc.addPage();
                    const imgObj = new Image();
                    imgObj.src = img.src;
                    const imgWidth = imgObj.width;
                    const imgHeight = imgObj.height;
                    const ratio = Math.min(pageWidth / imgWidth, pageHeight / imgHeight);
                    const finalWidth = imgWidth * ratio;
                    const finalHeight = imgHeight * ratio;
                    const x = (pageWidth - finalWidth) / 2;
                    const y = (pageHeight - finalHeight) / 2;
                    doc.addImage(img.src, 'JPEG', x, y, finalWidth, finalHeight, undefined, 'NONE');
                });
                
                doc.save(`${fileName}.pdf`);
                isComplete = true;
                mainBtn.disabled = false;
                mainBtn.innerText = "Document Downloaded";
                mainBtn.classList.add('complete');
            } catch (err) {
                mainBtn.innerText = "Error";
                mainBtn.disabled = false;
            }
        }, 200);
    }
</script>

</body>
</html>
