<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Page Forge | Professional Image to PDF Converter | Aethercore Interactive</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #000000;
            --surface: #0a0a0a;
            --accent: #ffffff;
            --border: rgba(255, 255, 255, 0.08);
            --text-muted: #666666;
            --success: #f0f0f0;
            --danger: #ff3b30;
        }

        /* 1. Global protection: No selection, no default browser callouts */
        * { 
            box-sizing: border-box; 
            -webkit-font-smoothing: antialiased; 
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        /* 2. Exception for the Input field to allow Copy/Paste/Select */
        input {
            -webkit-user-select: text !important;
            user-select: text !important;
            -webkit-touch-callout: default !important;
            pointer-events: auto !important;
            font-size: 16px !important; /* Mobile optimization: avoid zoom */
        }
        
        html, body { 
            background: var(--bg); 
            color: #fff; 
            margin: 0; 
            padding: 0; 
            min-height: 100%;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .app-wrapper { max-width: 1200px; margin: 0 auto; padding: 40px 20px; display: flex; flex-direction: column; gap: 30px; }
        header { text-align: center; padding: 40px 0 20px 0; }
        header h1 { font-weight: 100; font-size: 2.5rem; letter-spacing: -0.06em; margin: 0; }
        .branding-sub { color: var(--text-muted); font-weight: 400; font-size: 0.6rem; margin-top: 8px; letter-spacing: 0.5em; text-transform: uppercase; }

        .control-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 25px; display: flex; flex-direction: column; gap: 12px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-size: 0.6rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.1em; }
        
        #filename-input { 
            width: 100%; height: 54px; background: #000; border: 1px solid var(--border); 
            border-radius: 12px; color: #fff; padding: 0 15px; font-family: 'Inter', sans-serif; outline: none; 
        }
        #filename-input:focus { border-color: var(--accent); }

        .btn { width: 100%; height: 54px; border-radius: 12px; font-size: 0.8rem; font-weight: 500; cursor: pointer; transition: 0.3s; border: none; display: flex; align-items: center; justify-content: center; letter-spacing: 0.1em; text-transform: uppercase; }
        .btn-primary { background: var(--accent); color: #000; }
        .btn-action { background: transparent; border: 1px solid var(--border); color: #fff; }
        .btn-action:disabled { opacity: 0.1; cursor: not-allowed; }
        .btn-action.complete { background: var(--success); color: #000; border: none; }

        .gallery { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 15px; min-height: 300px; position: relative; }
        #sortable-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; min-height: 300px; }
        .item { aspect-ratio: 1; background: #000; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); position: relative; cursor: pointer; }
        .item img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        .sort-number { position: absolute; top: 6px; left: 6px; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px); color: #fff; font-size: 0.5rem; padding: 3px 6px; border-radius: 4px; z-index: 2; pointer-events: none; }

        #focus-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); backdrop-filter: blur(20px); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 10000; padding: 20px; }
        #focus-overlay.active { display: flex; }
        .delete-btn-focused { width: 300px; height: 54px; background: var(--danger); color: #fff; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.15em; cursor: pointer; border: none; }
    </style>
</head>
<body oncontextmenu="return false;">

<div id="focus-overlay" onclick="cancelDelete()">
    <div id="focus-container" onclick="event.stopPropagation()">
        <div id="focus-card"><img id="focus-img" src=""></div>
        <button class="delete-btn-focused" onclick="executeDelete()">Delete Image</button>
    </div>
</div>

<div class="app-wrapper">
    <header>
        <h1>Page Forge</h1>
        <div class="branding-sub">Aethercore Interactive</div>
    </header>

    <section class="control-panel">
        <div class="input-group">
            <label for="filename-input">Document Filename</label>
            <input type="text" id="filename-input" placeholder="e.g. Project_Documentation_2026" oncontextmenu="return true;">
        </div>
        <label for="uploader" class="btn btn-primary">
            Upload Images
            <input type="file" id="uploader" multiple accept="image/*" style="display:none" onchange="addPhotos(this.files)">
        </label>
        <button class="btn btn-action" id="mainBtn" onclick="handleAction()" disabled>Generate PDF</button>
    </section>

    <main class="gallery">
        <div id="sortable-grid"></div>
    </main>
</div>

<script>
    const grid = document.getElementById('sortable-grid');
    const mainBtn = document.getElementById('mainBtn');
    const filenameInput = document.getElementById('filename-input');
    const overlay = document.getElementById('focus-overlay');
    const focusImg = document.getElementById('focus-img');
    let isComplete = false;
    let targetCard = null;

    new Sortable(grid, { animation: 250, ghostClass: 'sortable-ghost', delay: 200, delayOnTouchOnly: true, onEnd: syncIndices });

    async function addPhotos(files) {
        for (let file of files) {
            const data = await toBase64(file);
            const card = document.createElement('div');
            card.className = 'item';
            card.onclick = function() { openFocus(this); };
            card.innerHTML = `<div class="sort-number"></div><img src="${data}">`;
            grid.appendChild(card);
        }
        syncIndices();
    }

    function toBase64(file) {
        return new Promise(res => {
            const reader = new FileReader();
            reader.onload = () => res(reader.result);
            reader.readAsDataURL(file);
        });
    }

    function openFocus(card) {
        targetCard = card;
        focusImg.src = targetCard.querySelector('img').src;
        overlay.classList.add('active');
    }

    function cancelDelete() { overlay.classList.remove('active'); targetCard = null; }

    function executeDelete() {
        if (targetCard) { targetCard.remove(); cancelDelete(); syncIndices(); }
    }

    function syncIndices() {
        const items = grid.querySelectorAll('.item');
        items.forEach((item, i) => item.querySelector('.sort-number').innerText = String(i + 1).padStart(2, '0'));
        mainBtn.disabled = items.length === 0;
        if (items.length > 0) mainBtn.innerText = `Generate PDF (${items.length})`;
    }

    function handleAction() {
        const images = grid.querySelectorAll('.item img');
        const fileName = filenameInput.value.trim() || "Exported_Document";
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'pt', 'a4');
        images.forEach((img, i) => {
            if (i > 0) doc.addPage();
            doc.addImage(img.src, 'JPEG', 0, 0, doc.internal.pageSize.getWidth(), doc.internal.pageSize.getHeight(), undefined, 'NONE');
        });
        doc.save(`${fileName}.pdf`);
    }
</script>

</body>
</html>
