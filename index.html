<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Page Forge | Professional Image to PDF Converter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root { --bg: #000000; --surface: #0a0a0a; --accent: #ffffff; --border: rgba(255, 255, 255, 0.08); --text-muted: #666666; --danger: #ff3b30; }
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        html, body { background: var(--bg); color: #fff; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-user-select: none; user-select: none; }
        
        .app-wrapper { max-width: 1200px; margin: 0 auto; padding: 40px 20px; display: flex; flex-direction: column; gap: 30px; }
        .control-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 25px; display: flex; flex-direction: column; gap: 12px; }
        #filename-input { width: 100%; height: 54px; background: #000; border: 1px solid var(--border); border-radius: 12px; color: #fff; padding: 0 15px; outline: none; }
        .btn { width: 100%; height: 54px; border-radius: 12px; font-size: 0.8rem; font-weight: 500; cursor: pointer; border: none; display: flex; align-items: center; justify-content: center; text-transform: uppercase; }
        .btn-primary { background: var(--accent); color: #000; }
        .btn-action { background: transparent; border: 1px solid var(--border); color: #fff; }
        
        .gallery { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 15px; min-height: 300px; position: relative; }
        #sortable-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .item { aspect-ratio: 1; background: #000; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); position: relative; cursor: pointer; }
        .item img { width: 100%; height: 100%; object-fit: cover; }
        .sort-number { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,0.6); padding: 3px 6px; border-radius: 4px; font-size: 0.5rem; }

        #focus-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); backdrop-filter: blur(20px); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 10000; touch-action: none; }
        #focus-overlay.active { display: flex; }
        #focus-container { width: 70vw; max-width: 380px; aspect-ratio: 1 / 1.4142; position: relative; display: flex; align-items: center; overflow: hidden; }
        .gallery-track { width: 100%; height: 100%; position: relative; }
        .focus-img-pane { position: absolute; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 10px; }
        .focus-img-pane img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .delete-btn-focused { margin-top: 20px; width: 300px; height: 54px; background: var(--danger); color: #fff; border-radius: 12px; border: none; cursor: pointer; }
    </style>
</head>
<body>

<div id="focus-overlay" onclick="cancelDelete()">
    <div id="focus-container" onclick="event.stopPropagation()">
        <div class="gallery-track">
            <div id="pane-current" class="focus-img-pane"><img id="focus-img-curr" src=""></div>
            <div id="pane-adjacent" class="focus-img-pane"><img id="focus-img-adj" src=""></div>
        </div>
    </div>
    <button class="delete-btn-focused" onclick="executeDelete()">Delete Image</button>
</div>

<div class="app-wrapper">
    <h1>Page Forge</h1>
    <section class="control-panel">
        <input type="text" id="filename-input" placeholder="Document Name">
        <label for="uploader" class="btn btn-primary">Upload Images<input type="file" id="uploader" multiple accept="image/*" style="display:none" onchange="addPhotos(this.files)"></label>
        <button class="btn btn-action" id="mainBtn" onclick="forgeDocument()">Generate PDF</button>
    </section>
    <main class="gallery"><div id="sortable-grid"></div></main>
</div>

<script>
    const grid = document.getElementById('sortable-grid'), overlay = document.getElementById('focus-overlay');
    const paneCurr = document.getElementById('pane-current'), paneAdj = document.getElementById('pane-adjacent');
    const imgCurr = document.getElementById('focus-img-curr'), imgAdj = document.getElementById('focus-img-adj');
    let targetCard = null, touchStartX = 0, currentX = 0, isSwiping = false, activeDir = null;

    new Sortable(grid, { animation: 250, onEnd: syncIndices });

    overlay.addEventListener('touchstart', (e) => {
        touchStartX = e.touches[0].clientX;
        isSwiping = true;
        paneAdj.style.display = 'none';
    });

    overlay.addEventListener('touchmove', (e) => {
        if (!isSwiping) return;
        currentX = e.touches[0].clientX - touchStartX;
        const items = Array.from(grid.querySelectorAll('.item')), idx = items.indexOf(targetCard);
        activeDir = currentX < 0 ? 'next' : 'prev';
        let adjIdx = activeDir === 'next' ? idx + 1 : idx - 1;

        if (items[adjIdx]) {
            imgAdj.src = items[adjIdx].querySelector('img').src;
            paneAdj.style.display = 'flex';
            paneAdj.style.transform = `translateX(${activeDir === 'next' ? 100 : -100}%)`;
            paneAdj.style.transform = `translateX(${activeDir === 'next' ? (100 + (currentX/window.innerWidth)*100) : (-100 + (currentX/window.innerWidth)*100)}%)`;
        }
        paneCurr.style.transform = `translateX(${currentX}px)`;
    });

    overlay.addEventListener('touchend', () => {
        isSwiping = false;
        if (Math.abs(currentX) > 100) {
            const items = Array.from(grid.querySelectorAll('.item'));
            targetCard = items[items.indexOf(targetCard) + (activeDir === 'next' ? 1 : -1)];
            if(targetCard) imgCurr.src = targetCard.querySelector('img').src;
        }
        paneCurr.style.transition = 'transform 0.3s ease';
        paneCurr.style.transform = 'translateX(0px)';
        setTimeout(() => { paneCurr.style.transition = 'none'; paneAdj.style.display = 'none'; }, 300);
    });

    function addPhotos(files) {
        for (let file of files) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const div = document.createElement('div'); div.className = 'item';
                div.innerHTML = `<div class="sort-number"></div><img src="${e.target.result}">`;
                div.onclick = () => { targetCard = div; imgCurr.src = e.target.result; overlay.classList.add('active'); };
                grid.appendChild(div);
                syncIndices();
            };
            reader.readAsDataURL(file);
        }
    }

    function executeDelete() { targetCard.remove(); overlay.classList.remove('active'); syncIndices(); }
    function cancelDelete() { overlay.classList.remove('active'); }
    function syncIndices() { grid.querySelectorAll('.item').forEach((item, i) => item.querySelector('.sort-number').innerText = i + 1); }

    function forgeDocument() {
        const { jsPDF } = window.jspdf; const doc = new jsPDF('p', 'pt', 'a4');
        grid.querySelectorAll('.item img').forEach((img, i) => {
            if (i > 0) doc.addPage();
            doc.addImage(img.src, 'JPEG', 0, 0, 595, 842);
        });
        doc.save("Document.pdf");
    }
</script>
</body>
</html>
